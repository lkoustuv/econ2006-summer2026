document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"eec3992e-c45b-4aa9-a4b4-7d1cd9301e88\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <script src=\"1c1921ca-02b8-4f0f-8723-3ab8c72a3bc7\"><\u002Fscript>\n  <style>\n    :root {\n      --maroon: #5B1A18;\n      --coral: #FD6467;\n      --orange: #D67236;\n      --gold: #F1BB7B;\n      --cream: #FDFAF5;\n      --cream-d: #F4EDE0;\n      --ink: #2C1810;\n      --mid: #5C3628;\n      --muted: #9A7B72;\n      --rule: #E8D5C4;\n      --sage: #6B9E71;\n      --type-title: 64px;\n      --type-cover: 76px;\n      --type-section: 72px;\n      --type-subtitle: 44px;\n      --type-body: 34px;\n      --type-big: 38px;\n      --type-small: 28px;\n      --type-eye: 24px;\n      --pad-top: 100px;\n      --pad-bot: 80px;\n      --pad-x: 100px;\n      --gap-title: 52px;\n      --gap-item: 28px;\n    }\n    body { background: #1A0A08; margin: 0; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-uneditable=\"\">\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 01 — COVER                                              -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Cover\" style=\"display: flex; align-items: center; justify-content: center; background: var(--cream); border: 12px solid var(--maroon); overflow: hidden;\">\n  <div style=\"position: absolute; inset: 0; background-image: radial-gradient(#E8D5C4 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; opacity: 0.45;\"><\u002Fdiv>\n  <svg style=\"position: absolute; right: 90px; bottom: 70px; opacity: 0.06; pointer-events: none;\" width=\"420\" height=\"360\" viewBox=\"0 0 420 360\">\n    <line x1=\"30\" y1=\"340\" x2=\"395\" y2=\"340\" stroke=\"#5B1A18\" stroke-width=\"2.5\"><\u002Fline>\n    <line x1=\"30\" y1=\"340\" x2=\"30\" y2=\"20\" stroke=\"#5B1A18\" stroke-width=\"2.5\"><\u002Fline>\n    <path d=\"M30,20 C210,24 380,200 380,340\" fill=\"none\" stroke=\"#5B1A18\" stroke-width=\"3.5\"><\u002Fpath>\n    <circle cx=\"180\" cy=\"120\" r=\"5\" fill=\"#D67236\"><\u002Fcircle>\n    <circle cx=\"290\" cy=\"240\" r=\"5\" fill=\"#D67236\"><\u002Fcircle>\n  <\u002Fsvg>\n  <div style=\"position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 60px 140px; max-width: 1300px;\">\n    <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--maroon);\">ECON 2006 · Module 1 · Chapters 1 &amp; 2<\u002Fspan>\n    <div style=\"width: 100%; height: 1px; background: var(--rule); margin: 26px 0;\"><\u002Fdiv>\n    <h1 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-cover); font-weight: 800; color: var(--maroon); line-height: 1.1; letter-spacing: -0.01em; margin: 0;\">Introduction to Economics<br>Scarcity, Choice &amp;<br>Opportunity Cost<\u002Fh1>\n    <p style=\"font-family: 'Playfair Display', serif; font-style: italic; font-size: var(--type-body); color: var(--orange); margin: 20px 0 0 0;\">Virginia Tech — Summer II 2026<\u002Fp>\n    <div style=\"display: flex; align-items: center; gap: 16px; margin: 26px 0 0; width: 300px;\">\n      <span style=\"flex: 1; height: 1px; background: var(--rule);\"><\u002Fspan>\n      <span style=\"color: var(--gold); font-size: 24px; letter-spacing: 0.1em;\">◆<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: var(--rule);\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); font-weight: 400; color: var(--muted); letter-spacing: 0.08em; margin: 26px 0 0 0;\">Koustuv Lahiri · <span>lkoustuv<\u002Fspan><span>@<\u002Fspan><span>vt.edu<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 02 — WHAT IS ECONOMICS? (from doc 3)                    -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"What is economics?\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">THE FIELD<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">What is economics?<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 var(--gap-title) 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; flex-direction: column; justify-content: flex-start;\">\n    <p style=\"font-family: 'Playfair Display', serif; font-style: italic; font-size: var(--type-subtitle); line-height: 1.65; color: var(--ink); max-width: 1300px; margin: 0 0 28px 0;\">\"Economics is the study of how people make choices when they can't have everything they want.\"<\u002Fp>\n    <div style=\"width: 60px; height: 1px; background: var(--rule); margin: 0 0 28px 0;\"><\u002Fdiv>\n    <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); line-height: 1.7; color: var(--mid); max-width: 1200px;\">Resources are limited. Wants are not. Scarcity forces choice — and where there is choice, there are trade-offs, incentives, and consequences worth studying.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 03 — MICRO VS MACRO (from doc 3, condensed)             -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Micro vs Macro\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">TWO LENSES<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">Micro zooms in. Macro zooms out.<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 var(--gap-title) 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; gap: 64px;\">\n    <div style=\"flex: 1; display: flex; flex-direction: column;\">\n      <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 1.5px solid var(--rule);\">MICROECONOMICS<\u002Fspan>\n      <p style=\"font-family: 'Playfair Display', serif; font-style: italic; font-size: var(--type-big); line-height: 1.5; color: var(--ink); margin: 20px 0 16px 0;\">One consumer. One firm. One market.<\u002Fp>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.6; color: var(--mid); margin: 0 0 24px 0;\">How prices, wages, and trade-offs are set when a single decision-maker faces a single choice.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 12px; margin-top: auto;\">\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--mid);\">→ Why Apple prices the iPhone at $999<\u002Fp>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--mid);\">→ Why your roommate picked CS over biology<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width: 1px; background: var(--rule);\"><\u002Fdiv>\n    <div style=\"flex: 1; display: flex; flex-direction: column;\">\n      <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 1.5px solid var(--rule);\">MACROECONOMICS · THIS COURSE<\u002Fspan>\n      <p style=\"font-family: 'Playfair Display', serif; font-style: italic; font-size: var(--type-big); line-height: 1.5; color: var(--ink); margin: 20px 0 16px 0;\">The whole economy in one frame.<\u002Fp>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.6; color: var(--mid); margin: 0 0 24px 0;\">Millions of households and firms, summed into national totals.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 12px; margin-top: auto;\">\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--mid);\">→ Why US GDP fell 8% in 2020<\u002Fp>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--mid);\">→ Why prices jumped 9% in 2022<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 04 — WHY DOES IT MATTER? (from doc 2, no emoji)         -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Why does it matter?\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">INTRODUCTION<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">Why does it matter?<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 var(--gap-title) 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; flex-direction: column; gap: 0;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--rule);\">\n      <div style=\"width: 10px; height: 10px; border-radius: 50%; background: var(--maroon); margin-top: 12px; flex-shrink: 0;\"><\u002Fdiv>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); line-height: 1.5; color: var(--ink); margin: 0;\">Economics shapes <strong>every aspect of daily life<\u002Fstrong> — from government policy to personal finance.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: flex-start; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--rule);\">\n      <div style=\"width: 10px; height: 10px; border-radius: 50%; background: var(--maroon); margin-top: 12px; flex-shrink: 0;\"><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); line-height: 1.5; color: var(--ink); margin: 0;\">It answers the questions that shape the world:<\u002Fp>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--mid); padding-left: 24px; margin: 0;\">→ Why do recessions happen?<\u002Fp>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--mid); padding-left: 24px; margin: 0;\">→ What drives inflation or unemployment?<\u002Fp>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--mid); padding-left: 24px; margin: 0;\">→ How do trade wars affect jobs?<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: flex-start; gap: 20px; padding: 18px 0;\">\n      <div style=\"width: 10px; height: 10px; border-radius: 50%; background: var(--maroon); margin-top: 12px; flex-shrink: 0;\"><\u002Fdiv>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); line-height: 1.5; color: var(--ink); margin: 0;\">Making informed decisions — personal, professional, civic — requires <strong>economic reasoning<\u002Fstrong>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 05 — THREE REASONS (from doc 3, NEW)                    -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Three reasons\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">STAKES<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">Three reasons this matters —<\u002Fh2>\n  <p style=\"font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: var(--type-subtitle); color: var(--muted); margin: 6px 0 0 0;\">even if you're not majoring in econ.<\u002Fp>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 16px 0 var(--gap-title) 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; gap: var(--gap-item); align-items: stretch;\">\n    <div style=\"flex: 1; background: #fff; border-top: 4px solid var(--maroon); padding: 36px 32px; display: flex; flex-direction: column;\">\n      <span style=\"font-family: 'Playfair Display', serif; font-size: var(--type-subtitle); font-weight: 700; color: var(--maroon); line-height: 1;\">01<\u002Fspan>\n      <h3 style=\"font-family: Jost, sans-serif; font-size: var(--type-body); font-weight: 700; color: var(--ink); margin: 14px 0 10px 0;\">Career<\u002Fh3>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.6; color: var(--mid); margin: 0;\">Your industry lives inside the macro environment. Rates decide funding, inflation decides whether your raise is real, recessions decide whether you keep your job.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 1; background: #fff; border-top: 4px solid var(--coral); padding: 36px 32px; display: flex; flex-direction: column;\">\n      <span style=\"font-family: 'Playfair Display', serif; font-size: var(--type-subtitle); font-weight: 700; color: var(--coral); line-height: 1;\">02<\u002Fspan>\n      <h3 style=\"font-family: Jost, sans-serif; font-size: var(--type-body); font-weight: 700; color: var(--ink); margin: 14px 0 10px 0;\">Citizenship<\u002Fh3>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.6; color: var(--mid); margin: 0;\">Every election is partly a referendum on macro policy — taxes, deficits, the Fed, trade. Better to vote informed.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 1; background: #fff; border-top: 4px solid var(--orange); padding: 36px 32px; display: flex; flex-direction: column;\">\n      <span style=\"font-family: 'Playfair Display', serif; font-size: var(--type-subtitle); font-weight: 700; color: var(--orange); line-height: 1;\">03<\u002Fspan>\n      <h3 style=\"font-family: Jost, sans-serif; font-size: var(--type-body); font-weight: 700; color: var(--ink); margin: 14px 0 10px 0;\">Your Life<\u002Fh3>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.6; color: var(--mid); margin: 0;\">Mortgages, savings, jobs — you will make these decisions whether you understand them or not. Understanding is cheaper than not.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 06 — SECTION BREAK: SCARCITY & CHOICE                  -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Scarcity &amp; Choice\" style=\"display: flex; align-items: center; justify-content: center; text-align: center; background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <div style=\"display: flex; flex-direction: column; align-items: center; padding: 48px 160px;\">\n    <div style=\"display: flex; align-items: center; gap: 14px; margin: 0 0 22px; width: 240px;\">\n      <span style=\"flex: 1; height: 1px; background: var(--rule);\"><\u002Fspan>\n      <span style=\"color: var(--gold); font-size: 24px; letter-spacing: 0.08em;\">◆ ◆ ◆<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: var(--rule);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-section); font-weight: 700; color: var(--maroon); line-height: 1.1; margin: 0;\">Scarcity &amp; Choice<\u002Fh1>\n    <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); line-height: 1.55; max-width: 580px; margin: 16px 0 0 0;\">Why do we need economics at all? Because resources are limited — and choices must be made.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 07 — THE CENTRAL PROBLEM (from doc 2, no emoji)         -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"The Central Problem\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">SCARCITY &amp; CHOICE<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">The Central Problem<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 24px 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; flex-direction: column;\">\n    <div style=\"background: var(--maroon); padding: 20px 28px; margin-bottom: 24px;\">\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); font-weight: 600; line-height: 1.4; color: var(--cream); margin: 0;\">Resources are <strong>scarce<\u002Fstrong> — so every society must make choices.<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); margin: 0 0 20px 0;\">All of economics tries to answer three fundamental questions:<\u002Fp>\n    <div style=\"flex: 1; display: flex; gap: 24px; align-items: stretch;\">\n      <div style=\"flex: 1; padding: 28px 24px; display: flex; flex-direction: column; align-items: flex-start; background: #fff; border: 1px solid var(--rule); border-top: 4px solid var(--maroon);\">\n        <span style=\"font-family: 'Playfair Display', serif; font-size: 40px; font-weight: 700; line-height: 1; color: var(--maroon);\">01<\u002Fspan>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); font-weight: 600; color: var(--ink); line-height: 1.3; margin: 12px 0 0 0;\">What to produce?<\u002Fp>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); margin: 8px 0 0 0;\">Which goods and services to make?<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1; padding: 28px 24px; display: flex; flex-direction: column; align-items: flex-start; background: #fff; border: 1px solid var(--rule); border-top: 4px solid var(--coral);\">\n        <span style=\"font-family: 'Playfair Display', serif; font-size: 40px; font-weight: 700; line-height: 1; color: var(--coral);\">02<\u002Fspan>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); font-weight: 600; color: var(--ink); line-height: 1.3; margin: 12px 0 0 0;\">How to produce it?<\u002Fp>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); margin: 8px 0 0 0;\">Which inputs and methods to use?<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1; padding: 28px 24px; display: flex; flex-direction: column; align-items: flex-start; background: #fff; border: 1px solid var(--rule); border-top: 4px solid var(--orange);\">\n        <span style=\"font-family: 'Playfair Display', serif; font-size: 40px; font-weight: 700; line-height: 1; color: var(--orange);\">03<\u002Fspan>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); font-weight: 600; color: var(--ink); line-height: 1.3; margin: 12px 0 0 0;\">For whom?<\u002Fp>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); margin: 8px 0 0 0;\">How is output distributed?<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 08 — EVERY CHOICE HAS A COST (from doc 3)              -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Every choice has a cost\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">TRADE-OFFS<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">Every choice has a cost.<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 var(--gap-title) 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; flex-direction: column;\">\n    <p style=\"font-family: 'Playfair Display', serif; font-style: italic; font-size: var(--type-subtitle); line-height: 1.6; color: var(--ink); margin: 0 0 10px 0;\">\"There ain't no such thing as a free lunch.\"<\u002Fp>\n    <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); margin: 0 0 40px 0;\">— Milton Friedman, 1975<\u002Fp>\n    <div style=\"display: flex; gap: 32px;\">\n      <div style=\"flex: 1; background: #fff; border-left: 4px solid var(--maroon); padding: 28px 32px;\">\n        <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 10px;\">THE STUDENT<\u002Fspan>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); line-height: 1.6; color: var(--ink); margin: 0;\">Tonight: study, sleep, or go out. You can't do all three. Whichever you skip is the cost of what you chose.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1; background: #fff; border-left: 4px solid var(--orange); padding: 28px 32px;\">\n        <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 10px;\">THE FARMER<\u002Fspan>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); line-height: 1.6; color: var(--ink); margin: 0;\">Plant corn or soybeans? The same acre can't grow both. Soybeans forgone is the cost of corn planted.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 09 — SECTION BREAK: OPPORTUNITY COST                   -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Opportunity Cost\" style=\"display: flex; align-items: center; justify-content: center; text-align: center; background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <div style=\"display: flex; flex-direction: column; align-items: center; padding: 48px 160px;\">\n    <div style=\"display: flex; align-items: center; gap: 14px; margin: 0 0 22px; width: 240px;\">\n      <span style=\"flex: 1; height: 1px; background: var(--rule);\"><\u002Fspan>\n      <span style=\"color: var(--gold); font-size: 24px; letter-spacing: 0.08em;\">◆ ◆ ◆<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: var(--rule);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-section); font-weight: 700; color: var(--maroon); line-height: 1.1; margin: 0;\">Opportunity Cost<\u002Fh1>\n    <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); line-height: 1.55; max-width: 580px; margin: 16px 0 0 0;\">A formal way to measure the true cost of any choice — the best thing you give up.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 10 — OPPORTUNITY COST DEFINITION (from doc 2, no emoji) -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Opportunity Cost Definition\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">OPPORTUNITY COST<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">Definition<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 var(--gap-title) 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; flex-direction: column;\">\n    <div style=\"background: var(--coral); padding: 22px 30px; margin-bottom: 28px;\">\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); font-weight: 600; line-height: 1.45; color: #fff; margin: 0;\">The value of the <strong>best alternative forgone<\u002Fstrong> when a choice is made.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #fff; border-left: 4px solid var(--coral); padding: 24px 30px; margin-bottom: 24px;\">\n      <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 8px;\">EXAMPLE — $10,000 DECISION<\u002Fspan>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.65; color: var(--ink); margin: 0 0 8px 0;\">You have $10,000. Options: pay tuition · buy a car · invest in stocks · take a vacation.<\u002Fp>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.65; color: var(--ink); margin: 0;\"><strong style=\"color: var(--coral);\">If you choose tuition,<\u002Fstrong> the opportunity cost is the value of your single best remaining option — whichever of the others you valued most.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding: 16px 24px; background: var(--cream-d); border-left: 3px solid var(--gold);\">\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--ink); margin: 0;\">Opportunity cost is <strong>not<\u002Fstrong> the sum of all forgone options — only the <strong>best one<\u002Fstrong>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 11 — SECTION BREAK: PPF                                 -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"PPF\" style=\"display: flex; align-items: center; justify-content: center; text-align: center; background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <div style=\"display: flex; flex-direction: column; align-items: center; padding: 48px 160px;\">\n    <div style=\"display: flex; align-items: center; gap: 14px; margin: 0 0 22px; width: 240px;\">\n      <span style=\"flex: 1; height: 1px; background: var(--rule);\"><\u002Fspan>\n      <span style=\"color: var(--gold); font-size: 24px; letter-spacing: 0.08em;\">◆ ◆ ◆<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: var(--rule);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-section); font-weight: 700; color: var(--maroon); line-height: 1.12; margin: 0;\">Production Possibility<br>Frontier<\u002Fh1>\n    <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); line-height: 1.55; max-width: 620px; margin: 16px 0 0 0;\">Visualizing scarcity, trade-offs, and opportunity cost for an entire economy.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 12 — SETTING UP THE MODEL (improved diagram)            -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Setting Up the Model\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">PRODUCTION POSSIBILITY FRONTIER<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">Setting Up the Model<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 var(--gap-title) 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; gap: 60px; align-items: flex-start;\">\n    <div style=\"flex: 1; display: flex; flex-direction: column;\">\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.65; color: var(--muted); margin: 0 0 18px 0;\">A simple economy — <strong style=\"color: var(--ink);\">100 acres of land<\u002Fstrong>, two goods:<\u002Fp>\n      <div style=\"display: flex; align-items: flex-start; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--rule);\">\n        <div style=\"width: 10px; height: 10px; border-radius: 50%; background: var(--maroon); margin-top: 10px; flex-shrink: 0;\"><\u002Fdiv>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); line-height: 1.5; color: var(--ink); margin: 0;\"><strong>Guns<\u002Fstrong> — 1 acre each → max 100<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: flex-start; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--rule);\">\n        <div style=\"width: 10px; height: 10px; border-radius: 50%; background: var(--maroon); margin-top: 10px; flex-shrink: 0;\"><\u002Fdiv>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); line-height: 1.5; color: var(--ink); margin: 0;\"><strong>Roses<\u002Fstrong> — ½ acre each → max 200<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border-left: 4px solid var(--maroon); padding: 20px 24px; margin-top: 24px;\">\n        <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 8px;\">PPF — DEFINITION<\u002Fspan>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.6; color: var(--ink); margin: 0;\">All combinations of goods producible when <strong>all resources are used efficiently.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); margin: 18px 0 0 0;\">Constant opportunity cost → straight-line PPF<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 0.85; display: flex; flex-direction: column; align-items: center; justify-content: center;\">\n      <svg viewBox=\"0 0 500 420\" style=\"width: 100%; max-width: 540px;\" xmlns=\"http://www.w3.org/2000/svg\">\n        <path d=\"M70,35 L70,370 L430,370 Z\" fill=\"rgba(91,26,24,0.04)\"><\u002Fpath>\n        <line x1=\"70\" y1=\"30\" x2=\"70\" y2=\"375\" stroke=\"#5C3628\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fline>\n        <line x1=\"65\" y1=\"370\" x2=\"445\" y2=\"370\" stroke=\"#5C3628\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fline>\n        <polygon points=\"70,22 64,34 76,34\" fill=\"#5C3628\"><\u002Fpolygon>\n        <polygon points=\"453,370 441,364 441,376\" fill=\"#5C3628\"><\u002Fpolygon>\n        <line x1=\"70\" y1=\"35\" x2=\"430\" y2=\"370\" stroke=\"#5B1A18\" stroke-width=\"3\"><\u002Fline>\n        <circle cx=\"70\" cy=\"35\" r=\"7\" fill=\"#5B1A18\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle>\n        <circle cx=\"160\" cy=\"119\" r=\"7\" fill=\"#5B1A18\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle>\n        <circle cx=\"250\" cy=\"203\" r=\"7\" fill=\"#5B1A18\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle>\n        <circle cx=\"340\" cy=\"286\" r=\"7\" fill=\"#5B1A18\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle>\n        <circle cx=\"430\" cy=\"370\" r=\"7\" fill=\"#5B1A18\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle>\n        <text x=\"84\" y=\"30\" font-size=\"24\" font-weight=\"700\" fill=\"#2C1810\" font-family=\"Jost, sans-serif\">A<\u002Ftext>\n        <text x=\"174\" y=\"114\" font-size=\"24\" font-weight=\"700\" fill=\"#2C1810\" font-family=\"Jost, sans-serif\">B<\u002Ftext>\n        <text x=\"264\" y=\"198\" font-size=\"24\" font-weight=\"700\" fill=\"#2C1810\" font-family=\"Jost, sans-serif\">C<\u002Ftext>\n        <text x=\"354\" y=\"282\" font-size=\"24\" font-weight=\"700\" fill=\"#2C1810\" font-family=\"Jost, sans-serif\">D<\u002Ftext>\n        <text x=\"412\" y=\"360\" text-anchor=\"end\" font-size=\"24\" font-weight=\"700\" fill=\"#2C1810\" font-family=\"Jost, sans-serif\">E<\u002Ftext>\n        <line x1=\"64\" y1=\"35\" x2=\"70\" y2=\"35\" stroke=\"#5B1A18\" stroke-width=\"2\"><\u002Fline>\n        <text x=\"56\" y=\"42\" text-anchor=\"end\" font-size=\"24\" fill=\"#5B1A18\" font-weight=\"700\" font-family=\"Jost, sans-serif\">100<\u002Ftext>\n        <line x1=\"64\" y1=\"119\" x2=\"70\" y2=\"119\" stroke=\"#9A7B72\" stroke-width=\"1.5\"><\u002Fline>\n        <text x=\"56\" y=\"126\" text-anchor=\"end\" font-size=\"20\" fill=\"#9A7B72\" font-family=\"Jost, sans-serif\">75<\u002Ftext>\n        <line x1=\"64\" y1=\"203\" x2=\"70\" y2=\"203\" stroke=\"#9A7B72\" stroke-width=\"1.5\"><\u002Fline>\n        <text x=\"56\" y=\"210\" text-anchor=\"end\" font-size=\"20\" fill=\"#9A7B72\" font-family=\"Jost, sans-serif\">50<\u002Ftext>\n        <line x1=\"64\" y1=\"286\" x2=\"70\" y2=\"286\" stroke=\"#9A7B72\" stroke-width=\"1.5\"><\u002Fline>\n        <text x=\"56\" y=\"293\" text-anchor=\"end\" font-size=\"20\" fill=\"#9A7B72\" font-family=\"Jost, sans-serif\">25<\u002Ftext>\n        <line x1=\"160\" y1=\"370\" x2=\"160\" y2=\"378\" stroke=\"#9A7B72\" stroke-width=\"1.5\"><\u002Fline>\n        <text x=\"160\" y=\"400\" text-anchor=\"middle\" font-size=\"20\" fill=\"#9A7B72\" font-family=\"Jost, sans-serif\">50<\u002Ftext>\n        <line x1=\"250\" y1=\"370\" x2=\"250\" y2=\"378\" stroke=\"#9A7B72\" stroke-width=\"1.5\"><\u002Fline>\n        <text x=\"250\" y=\"400\" text-anchor=\"middle\" font-size=\"20\" fill=\"#9A7B72\" font-family=\"Jost, sans-serif\">100<\u002Ftext>\n        <line x1=\"340\" y1=\"370\" x2=\"340\" y2=\"378\" stroke=\"#9A7B72\" stroke-width=\"1.5\"><\u002Fline>\n        <text x=\"340\" y=\"400\" text-anchor=\"middle\" font-size=\"20\" fill=\"#9A7B72\" font-family=\"Jost, sans-serif\">150<\u002Ftext>\n        <line x1=\"430\" y1=\"370\" x2=\"430\" y2=\"378\" stroke=\"#5B1A18\" stroke-width=\"2\"><\u002Fline>\n        <text x=\"430\" y=\"400\" text-anchor=\"middle\" font-size=\"24\" fill=\"#5B1A18\" font-weight=\"700\" font-family=\"Jost, sans-serif\">200<\u002Ftext>\n        <text x=\"260\" y=\"418\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\" fill=\"#5C3628\" font-family=\"Jost, sans-serif\">Roses<\u002Ftext>\n        <text x=\"28\" y=\"200\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\" fill=\"#5C3628\" font-family=\"Jost, sans-serif\" transform=\"rotate(-90,28,200)\">Guns<\u002Ftext>\n        <text x=\"300\" y=\"148\" font-size=\"24\" fill=\"#5B1A18\" font-style=\"italic\" font-weight=\"700\" font-family=\"Playfair Display, serif\">PPF<\u002Ftext>\n        <text x=\"130\" y=\"280\" font-size=\"24\" fill=\"rgba(91,26,24,0.22)\" font-style=\"italic\" font-family=\"Jost, sans-serif\">Feasible<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 13 — CONCAVE PPF (improved diagram)                     -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Concave PPF\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">PRODUCTION POSSIBILITY FRONTIER<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">Is the PPF Always a Straight Line?<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 var(--gap-title) 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; gap: 52px; align-items: flex-start;\">\n    <div style=\"flex: 1; display: flex; flex-direction: column;\">\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-body); line-height: 1.6; color: var(--ink); margin: 0 0 20px 0;\">In practice: <strong>No.<\u002Fstrong> Resources are not perfectly interchangeable — shifting more land to roses makes each additional rose progressively costlier.<\u002Fp>\n      <div style=\"display: flex; align-items: flex-start; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--rule);\">\n        <div style=\"width: 10px; height: 10px; border-radius: 50%; background: var(--maroon); margin-top: 10px; flex-shrink: 0;\"><\u002Fdiv>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.5; color: var(--ink); margin: 0;\"><strong>Law of Increasing Opportunity Costs<\u002Fstrong> — each extra unit costs more of the other good<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: flex-start; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--rule);\">\n        <div style=\"width: 10px; height: 10px; border-radius: 50%; background: var(--maroon); margin-top: 10px; flex-shrink: 0;\"><\u002Fdiv>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.5; color: var(--ink); margin: 0;\">PPF bows <strong>outward<\u002Fstrong> from the origin<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: flex-start; gap: 20px; padding: 14px 0;\">\n        <div style=\"width: 10px; height: 10px; border-radius: 50%; background: var(--maroon); margin-top: 10px; flex-shrink: 0;\"><\u002Fdiv>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.5; color: var(--ink); margin: 0;\">Slope = <strong>Marginal Rate of Transformation (MRT)<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 0.95; display: flex; flex-direction: column; align-items: center; justify-content: center;\">\n      <svg viewBox=\"0 0 520 445\" style=\"width: 100%; max-width: 560px;\" xmlns=\"http://www.w3.org/2000/svg\">\n        <path d=\"M70,390 L70,40 C280,40 430,240 430,390 Z\" fill=\"rgba(91,26,24,0.03)\"><\u002Fpath>\n        <line x1=\"70\" y1=\"35\" x2=\"70\" y2=\"395\" stroke=\"#5C3628\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fline>\n        <line x1=\"65\" y1=\"390\" x2=\"450\" y2=\"390\" stroke=\"#5C3628\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fline>\n        <polygon points=\"70,27 64,39 76,39\" fill=\"#5C3628\"><\u002Fpolygon>\n        <polygon points=\"458,390 446,384 446,396\" fill=\"#5C3628\"><\u002Fpolygon>\n        <path d=\"M 70,40 C 280,40 430,240 430,390\" fill=\"none\" stroke=\"#5B1A18\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n        <line x1=\"70\" y1=\"40\" x2=\"160\" y2=\"40\" stroke=\"#5C3628\" stroke-width=\"2\" stroke-dasharray=\"6,4\"><\u002Fline>\n        <line x1=\"160\" y1=\"40\" x2=\"160\" y2=\"54\" stroke=\"#5C3628\" stroke-width=\"2\" stroke-dasharray=\"6,4\"><\u002Fline>\n        <circle cx=\"70\" cy=\"40\" r=\"6\" fill=\"#5B1A18\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle>\n        <circle cx=\"160\" cy=\"54\" r=\"6\" fill=\"#5B1A18\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle>\n        \n        <text x=\"178\" y=\"52\" font-size=\"22\" fill=\"#FD6467\" font-weight=\"700\" font-family=\"Jost, sans-serif\">−4 guns<\u002Ftext>\n        <line x1=\"160\" y1=\"54\" x2=\"250\" y2=\"54\" stroke=\"#5C3628\" stroke-width=\"2\" stroke-dasharray=\"5,4\"><\u002Fline>\n        <line x1=\"250\" y1=\"54\" x2=\"250\" y2=\"96\" stroke=\"#5C3628\" stroke-width=\"2\" stroke-dasharray=\"5,4\"><\u002Fline>\n        <circle cx=\"250\" cy=\"96\" r=\"6\" fill=\"#5B1A18\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle>\n        \n        <text x=\"268\" y=\"82\" font-size=\"22\" fill=\"#D67236\" font-weight=\"700\" font-family=\"Jost, sans-serif\">−12 guns<\u002Ftext>\n        <line x1=\"250\" y1=\"96\" x2=\"340\" y2=\"96\" stroke=\"#5C3628\" stroke-width=\"2\" stroke-dasharray=\"4,4\"><\u002Fline>\n        <line x1=\"340\" y1=\"96\" x2=\"340\" y2=\"173\" stroke=\"#5C3628\" stroke-width=\"2\" stroke-dasharray=\"4,4\"><\u002Fline>\n        <circle cx=\"340\" cy=\"173\" r=\"6\" fill=\"#5B1A18\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle>\n        \n        <text x=\"358\" y=\"142\" font-size=\"22\" fill=\"#9A7B72\" font-weight=\"700\" font-family=\"Jost, sans-serif\">−22 guns<\u002Ftext>\n        <line x1=\"64\" y1=\"40\" x2=\"70\" y2=\"40\" stroke=\"#5B1A18\" stroke-width=\"2\"><\u002Fline>\n        <text x=\"56\" y=\"47\" text-anchor=\"end\" font-size=\"24\" fill=\"#5B1A18\" font-weight=\"700\" font-family=\"Jost, sans-serif\">100<\u002Ftext>\n        <line x1=\"160\" y1=\"390\" x2=\"160\" y2=\"398\" stroke=\"#9A7B72\" stroke-width=\"1.5\"><\u002Fline>\n        <text x=\"160\" y=\"418\" text-anchor=\"middle\" font-size=\"20\" fill=\"#9A7B72\" font-family=\"Jost, sans-serif\">50<\u002Ftext>\n        <line x1=\"250\" y1=\"390\" x2=\"250\" y2=\"398\" stroke=\"#9A7B72\" stroke-width=\"1.5\"><\u002Fline>\n        <text x=\"250\" y=\"418\" text-anchor=\"middle\" font-size=\"20\" fill=\"#9A7B72\" font-family=\"Jost, sans-serif\">100<\u002Ftext>\n        <line x1=\"340\" y1=\"390\" x2=\"340\" y2=\"398\" stroke=\"#9A7B72\" stroke-width=\"1.5\"><\u002Fline>\n        <text x=\"340\" y=\"418\" text-anchor=\"middle\" font-size=\"20\" fill=\"#9A7B72\" font-family=\"Jost, sans-serif\">150<\u002Ftext>\n        <line x1=\"430\" y1=\"390\" x2=\"430\" y2=\"398\" stroke=\"#5B1A18\" stroke-width=\"2\"><\u002Fline>\n        <text x=\"430\" y=\"418\" text-anchor=\"middle\" font-size=\"24\" fill=\"#5B1A18\" font-weight=\"700\" font-family=\"Jost, sans-serif\">200<\u002Ftext>\n        <text x=\"260\" y=\"440\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\" fill=\"#5C3628\" font-family=\"Jost, sans-serif\">Roses<\u002Ftext>\n        <text x=\"28\" y=\"215\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\" fill=\"#5C3628\" font-family=\"Jost, sans-serif\" transform=\"rotate(-90,28,215)\">Guns<\u002Ftext>\n        <text x=\"390\" y=\"230\" font-size=\"24\" fill=\"#5B1A18\" font-style=\"italic\" font-weight=\"700\" font-family=\"Playfair Display, serif\">PPF<\u002Ftext>\n        <rect x=\"65\" y=\"245\" width=\"280\" height=\"95\" rx=\"4\" fill=\"white\" stroke=\"#E8D5C4\" stroke-width=\"1\"><\u002Frect>\n        <text x=\"205\" y=\"275\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#2C1810\" font-family=\"Jost, sans-serif\">Each step = +50 roses<\u002Ftext>\n        <text x=\"205\" y=\"303\" text-anchor=\"middle\" font-size=\"22\" fill=\"#9A7B72\" font-family=\"Jost, sans-serif\">Guns lost: 4 → 12 → 22<\u002Ftext>\n        <text x=\"205\" y=\"329\" text-anchor=\"middle\" font-size=\"22\" fill=\"#9A7B72\" font-family=\"Jost, sans-serif\">Opportunity cost rises<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 14 — ON / INSIDE / OUTSIDE PPF (improved diagram)       -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"On, Inside, Outside\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">PRODUCTION POSSIBILITY FRONTIER<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">Where Can We Operate?<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 var(--gap-title) 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; gap: 52px; align-items: flex-start;\">\n    <div style=\"flex: 1; display: flex; flex-direction: column;\">\n      <div style=\"display: flex; align-items: flex-start; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--rule);\">\n        <div style=\"width: 10px; height: 10px; border-radius: 50%; background: var(--maroon); margin-top: 10px; flex-shrink: 0;\"><\u002Fdiv>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.5; color: var(--ink); margin: 0;\"><strong style=\"color: var(--maroon);\">On the PPF<\u002Fstrong> — all resources used efficiently<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: flex-start; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--rule);\">\n        <div style=\"width: 10px; height: 10px; border-radius: 50%; background: var(--orange); margin-top: 10px; flex-shrink: 0;\"><\u002Fdiv>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.5; color: var(--ink); margin: 0;\"><strong style=\"color: var(--orange);\">Inside the PPF<\u002Fstrong> — resources are idle or technology underused<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); margin: 18px 0 10px 0;\">Why might we be inside?<\u002Fp>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--mid); padding-left: 24px; margin: 0 0 8px 0;\">→ Unemployment — workers without jobs<\u002Fp>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--mid); padding-left: 24px; margin: 0 0 20px 0;\">→ Technology not used to its full potential<\u002Fp>\n      <div style=\"background: #fff; border-left: 4px solid var(--sage); padding: 20px 24px; margin-top: auto;\">\n        <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 8px;\">SHIFTING OUTWARD = ECONOMIC GROWTH<\u002Fspan>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.6; color: var(--ink); margin: 0;\">More resources or better technology expands the PPF — the economy can produce more of everything.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 0.9; display: flex; flex-direction: column; align-items: center; justify-content: center;\">\n      <svg viewBox=\"0 0 660 410\" style=\"width: 100%; max-width: 560px;\" xmlns=\"http://www.w3.org/2000/svg\">\n        <path d=\"M70,370 L70,30 C250,30 400,210 400,370 Z\" fill=\"rgba(91,26,24,0.03)\"><\u002Fpath>\n        <line x1=\"70\" y1=\"25\" x2=\"70\" y2=\"375\" stroke=\"#5C3628\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fline>\n        <line x1=\"65\" y1=\"370\" x2=\"450\" y2=\"370\" stroke=\"#5C3628\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fline>\n        <polygon points=\"70,17 64,29 76,29\" fill=\"#5C3628\"><\u002Fpolygon>\n        <polygon points=\"458,370 446,364 446,376\" fill=\"#5C3628\"><\u002Fpolygon>\n        <path d=\"M 70,14 C 280,14 430,190 430,380\" fill=\"none\" stroke=\"#E8D5C4\" stroke-width=\"2.5\" stroke-dasharray=\"8,6\"><\u002Fpath>\n        <path d=\"M 70,30 C 250,30 400,210 400,370\" fill=\"none\" stroke=\"#5B1A18\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n        <circle cx=\"260\" cy=\"100\" r=\"9\" fill=\"#2C1810\" stroke=\"#fff\" stroke-width=\"2.5\"><\u002Fcircle>\n        <text x=\"280\" y=\"96\" font-size=\"22\" fill=\"#2C1810\" font-weight=\"700\" font-family=\"Jost, sans-serif\">A — On PPF (Efficient)<\u002Ftext>\n        <circle cx=\"185\" cy=\"220\" r=\"9\" fill=\"#9A7B72\" stroke=\"#fff\" stroke-width=\"2.5\"><\u002Fcircle>\n        <text x=\"205\" y=\"216\" font-size=\"22\" fill=\"#5C3628\" font-weight=\"700\" font-family=\"Jost, sans-serif\">B — Inside (Inefficient)<\u002Ftext>\n        <line x1=\"185\" y1=\"216\" x2=\"185\" y2=\"55\" stroke=\"#9A7B72\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"><\u002Fline>\n        <text x=\"192\" y=\"140\" font-size=\"20\" fill=\"#9A7B72\" font-style=\"italic\" font-family=\"Jost, sans-serif\">wasted capacity<\u002Ftext>\n        <circle cx=\"330\" cy=\"40\" r=\"9\" fill=\"#5C3628\" stroke=\"#fff\" stroke-width=\"2.5\"><\u002Fcircle>\n        <text x=\"348\" y=\"36\" font-size=\"22\" fill=\"#5C3628\" font-weight=\"700\" font-family=\"Jost, sans-serif\">C — Outside<\u002Ftext>\n        <text x=\"348\" y=\"57\" font-size=\"22\" fill=\"#5C3628\" font-weight=\"700\" font-family=\"Jost, sans-serif\">(Unattainable now)<\u002Ftext>\n        <text x=\"440\" y=\"158\" font-size=\"20\" fill=\"#9A7B72\" font-style=\"italic\" font-family=\"Jost, sans-serif\">Future PPF<\u002Ftext>\n        <text x=\"440\" y=\"180\" font-size=\"20\" fill=\"#9A7B72\" font-style=\"italic\" font-family=\"Jost, sans-serif\">(after growth)<\u002Ftext>\n        <line x1=\"64\" y1=\"30\" x2=\"70\" y2=\"30\" stroke=\"#5B1A18\" stroke-width=\"2\"><\u002Fline>\n        <text x=\"56\" y=\"37\" text-anchor=\"end\" font-size=\"24\" fill=\"#5B1A18\" font-weight=\"700\" font-family=\"Jost, sans-serif\">100<\u002Ftext>\n        <line x1=\"400\" y1=\"370\" x2=\"400\" y2=\"378\" stroke=\"#5B1A18\" stroke-width=\"2\"><\u002Fline>\n        <text x=\"400\" y=\"400\" text-anchor=\"middle\" font-size=\"24\" fill=\"#5B1A18\" font-weight=\"700\" font-family=\"Jost, sans-serif\">200<\u002Ftext>\n        <text x=\"245\" y=\"404\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\" fill=\"#5C3628\" font-family=\"Jost, sans-serif\">Roses<\u002Ftext>\n        <text x=\"28\" y=\"200\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\" fill=\"#5C3628\" font-family=\"Jost, sans-serif\" transform=\"rotate(-90,28,200)\">Guns<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 15 — HOW ARE RESOURCES ALLOCATED?                       -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Resource Allocation\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">SCARCITY &amp; CHOICE<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">How Are Resources Allocated?<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 24px 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; flex-direction: column;\">\n    <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); margin: 0 0 24px 0;\">Given scarcity, which mechanism decides what gets produced and who gets it?<\u002Fp>\n    <div style=\"display: flex; gap: 32px; flex: 1; align-items: stretch;\">\n      <div style=\"flex: 1; padding: 32px 28px; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--rule); border-top: 4px solid var(--maroon);\">\n        <h3 style=\"font-family: Jost, sans-serif; font-size: var(--type-body); font-weight: 700; color: var(--maroon); margin: 0 0 14px 0;\">Command Economy<\u002Fh3>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.65; color: var(--ink); margin: 0;\">Government decides what, how, and for whom to produce. Central planning replaces the market.<\u002Fp>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); font-style: italic; margin: auto 0 0 0; padding-top: 14px;\">Former USSR · Cuba · North Korea<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1; padding: 32px 28px; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--rule); border-top: 4px solid var(--coral);\">\n        <h3 style=\"font-family: Jost, sans-serif; font-size: var(--type-body); font-weight: 700; color: var(--coral); margin: 0 0 14px 0;\">Market Economy<\u002Fh3>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.65; color: var(--ink); margin: 0;\"><strong>Price<\u002Fstrong> is the key signal — it directs resources to their highest-valued uses through supply and demand.<\u002Fp>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--muted); font-style: italic; margin: auto 0 0 0; padding-top: 14px;\">Farmer's crop choice · Your choice of major<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #fff; border-left: 4px solid var(--maroon); padding: 18px 24px; margin-top: 24px;\">\n      <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px;\">COMING UP NEXT<\u002Fspan>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--ink); margin: 0;\">Since price is central to the market mechanism, we need to understand how it's determined. That's where Demand &amp; Supply comes in.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 16 — SUMMARY                                            -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Summary\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">WRAP-UP<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">What We Covered<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 var(--gap-title) 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; flex-direction: column; gap: 16px; justify-content: center;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 20px; background: #fff; border: 1px solid var(--rule); border-left: 4px solid var(--maroon); padding: 20px 24px;\">\n      <span style=\"font-family: 'Playfair Display', serif; font-size: var(--type-body); font-weight: 700; color: var(--maroon); min-width: 28px; line-height: 1;\">1<\u002Fspan>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.55; color: var(--ink); margin: 0;\">Economics studies how <strong>scarce resources<\u002Fstrong> are allocated — micro (individual markets) and macro (economy-wide).<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: flex-start; gap: 20px; background: #fff; border: 1px solid var(--rule); border-left: 4px solid var(--coral); padding: 20px 24px;\">\n      <span style=\"font-family: 'Playfair Display', serif; font-size: var(--type-body); font-weight: 700; color: var(--coral); min-width: 28px; line-height: 1;\">2<\u002Fspan>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.55; color: var(--ink); margin: 0;\">Scarcity forces choices. Every choice has a <strong>trade-off<\u002Fstrong> — a cost and a benefit that must be weighed.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: flex-start; gap: 20px; background: #fff; border: 1px solid var(--rule); border-left: 4px solid var(--orange); padding: 20px 24px;\">\n      <span style=\"font-family: 'Playfair Display', serif; font-size: var(--type-body); font-weight: 700; color: var(--orange); min-width: 28px; line-height: 1;\">3<\u002Fspan>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.55; color: var(--ink); margin: 0;\"><strong>Opportunity cost<\u002Fstrong> = value of the best alternative forgone — the formal price of any decision.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: flex-start; gap: 20px; background: #fff; border: 1px solid var(--rule); border-left: 4px solid var(--sage); padding: 20px 24px;\">\n      <span style=\"font-family: 'Playfair Display', serif; font-size: var(--type-body); font-weight: 700; color: var(--sage); min-width: 28px; line-height: 1;\">4<\u002Fspan>\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.55; color: var(--ink); margin: 0;\">The <strong>PPF<\u002Fstrong> maps all efficient combinations; its concave shape reflects the Law of Increasing Opportunity Costs.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════════════════════════════════════════════════ -->\n<!-- SLIDE 17 — UP NEXT                                            -->\n<!-- ══════════════════════════════════════════════════════════════ -->\n<section data-label=\"Up Next\" style=\"display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) var(--pad-bot); background: var(--cream); border-top: 5px solid var(--maroon); border-bottom: 3px solid var(--gold); overflow: hidden;\">\n  <span style=\"font-family: Jost, sans-serif; font-size: var(--type-eye); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral);\">LOOKING AHEAD<\u002Fspan>\n  <h2 style=\"font-family: 'Playfair Display', Georgia, serif; font-size: var(--type-title); font-weight: 700; line-height: 1.15; color: var(--maroon); margin: 10px 0 0 0;\">Up Next: Demand &amp; Supply<\u002Fh2>\n  <div style=\"width: 50px; height: 3px; background: var(--coral); margin: 10px 0 var(--gap-title) 0;\"><\u002Fdiv>\n  <div style=\"flex: 1; display: flex; flex-direction: column;\">\n    <p style=\"font-family: 'Playfair Display', serif; font-style: italic; font-size: var(--type-big); line-height: 1.6; color: var(--ink); max-width: 1100px; margin: 0 0 32px 0;\">We've seen why choices must be made. Now: how does a market economy make them?<\u002Fp>\n    <div style=\"display: flex; align-items: center; gap: 24px; background: #fff; border: 1px solid var(--rule); border-left: 5px solid var(--maroon); padding: 28px 32px; margin-bottom: 24px;\">\n      <div style=\"display: flex; flex-direction: column;\">\n        <h3 style=\"font-family: Jost, sans-serif; font-size: var(--type-body); font-weight: 700; color: var(--maroon); margin: 0 0 8px 0;\">Price is the answer<\u002Fh3>\n        <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); line-height: 1.6; color: var(--ink); margin: 0;\">Price signals guide what gets produced, how much, and who gets it. Topic 2 explores how prices emerge through Demand and Supply.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding: 18px 24px; background: var(--cream-d); border-left: 3px solid var(--gold); display: flex; align-items: center; gap: 16px;\">\n      <p style=\"font-family: Jost, sans-serif; font-size: var(--type-small); color: var(--mid); font-weight: 500; margin: 0;\">Read ahead: Chapters 3 &amp; 4 — Demand, Supply, and Market Equilibrium<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
